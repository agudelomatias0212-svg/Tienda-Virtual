<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Tienda virtual con carrito</title>
</head>
<body>

    <header class="encabezado">
        <h1>Tienda Virtual</h1>
    </header>

    <main class="contenedor">

        <section class="catalogo">
            <h2>Catálogo</h2>

            <div class="barra-filtros">
                <div id="filtros" class="filtros"></div>
                <p id="contador" class="contador">Mostrando 0 productos</p>
            </div>

            <div id="productos" class="productos"></div>
        </section>

        <aside class="carrito">
            <h2>Carrito de compras</h2>

            <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío</p>

            <ul id="lista-carrito" class="lista-carrito"></ul>

            <div class="resumen">
                <p>Artículos: <span id="articulos">0</span></p>
                <p>Subtotal: <span id="subtotal">$ 0</span></p>
                <p>Descuento: <span id="descuento">-$ 0</span></p>
                <p class="total">Total: <span id="total">$ 0</span></p>
            </div>

            <button id="btn-vaciar" class="btn-vaciar">Vaciar carrito</button>
        </aside>

    </main>

</body>
</html>
